# =============================================================================
# Default Configuration for TGNN Benchmark
# Master's Thesis: Temporal Graph Neural Networks for MTS Classification
# =============================================================================

# ---- Research Questions Mapping ----
# RQ1: TGNN vs baselines on UEA (Phase 1) → accuracy, F1, compute cost
# RQ2: Predefined vs adaptive graph construction → across all datasets
# RQ3: Phase 1 findings vs Phase 2 (higher-dim DSA dataset) → generalization

# ---- Experiment settings ----
experiment:
  seed: 42
  num_seeds: 5                  # Run each config with 5 seeds for statistical robustness
  seeds: [42, 123, 456, 789, 1024]
  device: "cpu"                 # auto | cpu | cuda | mps
  num_workers: 0                # 0 = main process only (avoids spawn/pickle issues on macOS)
  pin_memory: true
  deterministic: true

# ---- Training ----
training:
  epochs: 200
  patience: 30                  # Early stopping patience
  min_delta: 0.001              # Minimum improvement for early stopping
  batch_size: 32
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"           # cosine | step | plateau | none
  scheduler_params:
    T_max: 200
    eta_min: 0.00001
  gradient_clip_val: 1.0
  label_smoothing: 0.0

# ---- Model defaults ----
models:
  lstm:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: true

  cnn_bigru:
    cnn_channels: [64, 128]
    kernel_size: 3
    gru_hidden_dim: 128
    gru_num_layers: 2
    dropout: 0.3

  tcn:
    num_channels: [64, 128, 128]
    kernel_size: 3
    dropout: 0.2

  transformer:
    d_model: 128
    nhead: 4                    # head_dim = d_model/nhead = 32; nhead=8 gives dim=16 (too small)
    num_layers: 3
    dim_feedforward: 256
    dropout: 0.1
    positional_encoding: "sinusoidal"  # sinusoidal | learnable

  # -- TGNN architectures --
  gconv_lstm:
    hidden_dim: 64
    K: 2                        # Chebyshev filter size
    num_layers: 2
    dropout: 0.3

  gconv_gru:
    hidden_dim: 64
    K: 2
    num_layers: 2
    dropout: 0.3

  a3tgcn:
    hidden_dim: 64
    periods: 1
    dropout: 0.3

  dcrnn:
    hidden_dim: 64
    K: 2
    num_layers: 2
    dropout: 0.3

  hybrid_tgnn:
    hidden_dim: 64
    K: 2
    num_layers: 2
    dropout: 0.3
    adaptive_embed_dim: 16
    adaptive_sparsity: 0.1

  astgcn:
    hidden_dim: 64
    K: 3
    num_blocks: 2
    dropout: 0.3

# ---- Graph construction ----
graph:
  # Predefined strategies
  predefined:
    # Strategies: domain | correlation | dtw | dtw_windowed | knn_correlation | knn_dtw
    type: "domain"
    normalize: true
    self_loops: true

    # --- Correlation graph params ---
    corr_threshold: 0.5         # Min |Pearson r| for an edge

    # --- DTW graph params ---
    # dtw_threshold OR dtw_k must be set when using dtw / dtw_windowed
    dtw_threshold: null         # Min Gaussian similarity for an edge (0-1)
    dtw_k: null                 # KNN k for DTW graph (mutually exclusive with dtw_threshold)
    dtw_window: null            # Sakoe-Chiba band for dtw_windowed (int, e.g. 10% of seq_len)

    # --- KNN graph params ---
    # knn_k must be set when using knn_correlation or knn_dtw
    knn_k: null                 # Required for knn_* strategies (no default — must set per dataset)
    knn_metric: "correlation"   # 'correlation' or 'dtw'

  # Adaptive (learned) strategies
  adaptive:
    type: "learned"             # learned | attention
    init: "random"              # random | identity | correlation_init
    embed_dim: 16               # Node embedding dimension for learned adjacency
    sparsity_threshold: 0.1     # Threshold for pruning weak edges
    symmetric: true             # Force symmetric adjacency

# ---- Evaluation ----
evaluation:
  metrics: ["accuracy", "macro_f1", "weighted_f1", "per_class_f1"]
  compute_cost: true            # Track FLOPs, params, training time, inference time
  confusion_matrix: true
  statistical_test: "wilcoxon"  # wilcoxon | paired_t | bootstrap

# ---- Logging ----
logging:
  level: "INFO"
  save_dir: "results"
  tensorboard: true
  save_best_model: true
  save_predictions: true
  log_every_n_steps: 10
